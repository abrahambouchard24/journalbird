<title>JournalBird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: one centered column on plain paper. White with black ink by day, black with white ink by night; the birds are two-tone line art in the same ink. */
:root {
  --paper: #ffffff;
  --ink: #111111;
  --ash: #6b6b6b;
  --line: rgba(17, 17, 17, 0.16);
  --field: rgba(17, 17, 17, 0.04);
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
  --label: "Jost", "Futura", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
body[data-sky="night"] {
  --paper: #000000;
  --ink: #f5f5f5;
  --ash: #9b9b9b;
  --line: rgba(255, 255, 255, 0.22);
  --field: rgba(255, 255, 255, 0.06);
  color-scheme: dark;
}
html { background: #fff; }
html:has(body[data-sky="night"]) { background: #000; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--ink); color: var(--paper); }

/* App frame */
.app { position: relative; height: 100%; display: flex; flex-direction: column; padding-inline: 16px; overflow-y: auto; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 16px 4px; width: 100%; max-width: 40rem; margin-inline: auto; }
.wordmark { font-family: var(--display); letter-spacing: 0.4em; font-size: 0.78rem; color: var(--ink); background: none; border: none; padding: 6px 0; }
.top-links { display: flex; gap: 6px; }
.stage { flex: 1; width: 100%; max-width: 36rem; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; padding-block: 14px 56px; min-width: 0; }
.scene { display: flex; flex-direction: column; gap: 18px; animation: rise 0.8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.eyebrow { font-family: var(--label); font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ash); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(2.2rem, 8vw, 3.2rem); letter-spacing: 0.05em; }
h2 { font-size: clamp(1.4rem, 5vw, 1.8rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.lede { color: var(--ash); font-size: 1.02rem; max-width: 30rem; }
.dim { color: var(--ash); font-style: italic; font-size: 0.98rem; }
.fine { font-family: var(--label); font-size: 0.75rem; letter-spacing: 0.06em; color: var(--ash); }
.center { text-align: center; align-items: center; }

/* Hero + birds */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.bird { background: none; border: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
.bird svg { width: min(280px, 74vw); height: auto; overflow: visible; }
.bk { fill: var(--ink); stroke: none; }
.wh { fill: var(--paper); stroke: none; }
.ol { fill: var(--paper); stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; }
.ln { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.lw { fill: none; stroke: var(--paper); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.bird .bob { animation: bob 4.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.bird .head { animation: tilt 9s ease-in-out infinite; }
@keyframes tilt { 0%, 38%, 100% { transform: rotate(0); } 44%, 60% { transform: rotate(-7deg); } 68%, 82% { transform: rotate(4deg); } }
.bird .eye { animation: blink 5.5s infinite; }
.bird .owl-all { transform-origin: 130px 166px; animation: sway 8s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(0); } 35% { transform: rotate(-2.2deg); } 70% { transform: rotate(2deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.06); } }
.bird.hop svg { animation: hop 0.55s cubic-bezier(.3,.7,.4,1); }
@keyframes hop { 30% { transform: translateY(-16px) rotate(-2deg); } 60% { transform: translateY(0); } 78% { transform: translateY(-5px); } }
.owl .shut { display: none; }
.owl.asleep .shut { display: inline; }
.owl.asleep .open { display: none; }
.owl.asleep .owl-all { animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.025, 1.035); } }
.z { font-family: var(--display); fill: var(--ink); opacity: 0; animation: zee 4.5s ease-in-out infinite; }
.z.z2 { animation-delay: 1.5s; }
.owl:not(.asleep) .z { display: none; }
@keyframes zee { 0% { opacity: 0; transform: translate(0, 8px); } 30% { opacity: 0.9; } 100% { opacity: 0; transform: translate(10px, -20px); } }
.note-pop { position: absolute; pointer-events: none; font-size: 1.4rem; color: var(--ink); animation: floatup 1.4s ease-out forwards; }
@keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } }
.bird-wrap { position: relative; }
.bubble { position: relative; max-width: 21rem; padding: 9px 16px; border: 1px solid var(--ink); border-radius: 18px; background: var(--paper); color: var(--ink); font-style: italic; font-size: 1rem; line-height: 1.4; }
.bubble::before { content: ""; position: absolute; top: -7px; left: 50%; margin-left: -6px; width: 11px; height: 11px; background: var(--paper); border-left: 1px solid var(--ink); border-top: 1px solid var(--ink); transform: rotate(45deg); }

/* Phase nav */
.phases { display: flex; gap: 6px; margin: 6px auto 0; max-width: 26rem; width: 100%; }
.phase { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; font-family: var(--label); font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; padding: 9px 6px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--ash); }
.phase i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; flex: none; }
.phase[aria-current="page"] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.phase[aria-current="page"] i { background: var(--paper); border-color: var(--paper); }
.phase:disabled { opacity: 0.4; cursor: default; }

/* Cards and controls */
.card { border: 1px solid var(--line); border-radius: 8px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card .prompt { font-family: var(--display); font-size: 1.2rem; line-height: 1.3; }
button { font: inherit; color: inherit; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.center .actions, .actions.center { justify-content: center; }
.btn { font-family: var(--label); font-size: 0.82rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 15px 28px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); transition: background-color 0.3s, color 0.3s, border-color 0.6s, transform 0.2s, opacity 0.3s; }
.btn:hover { background: transparent; color: var(--ink); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.small { padding: 11px 18px; font-size: 0.72rem; }
.ghost { font-family: var(--label); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; background: none; border: none; color: var(--ash); padding: 10px 6px; }
.ghost:hover { color: var(--ink); }
.link { background: none; border: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
input[type="text"], textarea { width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; resize: vertical; box-sizing: border-box; }
textarea { min-height: 7rem; line-height: 1.55; }
textarea.tall { min-height: 11rem; }
input::placeholder, textarea::placeholder { color: var(--ash); font-style: italic; opacity: 0.8; }
input:focus, textarea:focus { outline: none; border-color: var(--ink); }

/* Tasks */
.bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width 0.5s ease; }
.progress { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: flex; align-items: center; gap: 12px; padding-block: 9px; border-top: 1px solid var(--line); }
.task:first-child { border-top: none; }
.task span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; flex: none; display: grid; place-items: center; padding: 0; }
.task.done .check { background: var(--ink); }
.task.done .check::after { content: ""; width: 7px; height: 12px; border: solid var(--paper); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.task.done span { text-decoration: line-through; color: var(--ash); }
.x { background: none; border: none; color: var(--ash); font-size: 1.4rem; line-height: 1; padding: 4px 8px; }
.x:hover { color: var(--ink); }
.add { display: flex; gap: 10px; }
.add input { flex: 1; }

/* Check-ins */
.moods { display: flex; flex-wrap: wrap; gap: 8px; }
.mood { font-family: var(--label); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--ink); }
.mood i { display: none; }
.mood[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.feed li { display: grid; grid-template-columns: 4.6rem 1fr auto; gap: 10px; align-items: start; padding-block: 10px; border-top: 1px solid var(--line); }
.feed time { font-family: var(--label); font-size: 0.72rem; letter-spacing: 0.1em; color: var(--ash); padding-top: 4px; }
.feed .what { min-width: 0; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.chip { align-self: flex-start; font-family: var(--label); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--ink); color: var(--ink); }
.excerpt { white-space: pre-wrap; overflow-wrap: anywhere; font-style: italic; font-weight: 300; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; border-left: 1px solid var(--ink); padding-left: 14px; }
.big { font-family: var(--display); font-size: 1.35rem; line-height: 1.3; overflow-wrap: anywhere; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.done-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.done-list li { display: flex; gap: 10px; align-items: baseline; overflow-wrap: anywhere; }
.done-list .m { font-family: var(--label); color: var(--ink); flex: none; }
.done-list .off { color: var(--ink); }
.done-list .on { text-decoration: line-through; color: var(--ash); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

/* History */
.hist { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 16px 18px; border-radius: 8px; border: 1px solid var(--line); background: none; width: 100%; }
.hist:hover { border-color: var(--ink); }
.hist .d { font-family: var(--display); font-size: 1.15rem; }
.hist .s { color: var(--ash); font-style: italic; overflow-wrap: anywhere; grid-column: 1 / -1; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); border: 1px solid var(--ink); }
.dots i.off { background: transparent; border-color: var(--line); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats strong { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
.search { margin-bottom: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .scene { opacity: 1; }
}
</style>

<div class="app">
  <div class="topbar">
    <button class="wordmark" data-go="home">JOURNALBIRD</button>
    <div class="top-links">
      <button class="ghost" id="b-hist" data-go="history">Journal</button>
      <button class="ghost" data-go="settings">Me</button>
    </div>
  </div>
  <nav class="phases" id="nav" aria-label="Parts of the day"></nav>
  <main class="stage" id="stage"></main>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => new Date(k + 'T12:00:00');
const longDate = k => dateOf(k).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const shortDate = k => dateOf(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

/* ---------- storage ---------- */
const KEY = 'journalbird.v1';
let db = { settings: { name: '', welcomed: false }, days: {} };
try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw && raw.days) db = { settings: { name: '', welcomed: false, ...(raw.settings || {}) }, days: raw.days }; } catch {}
let saveTimer = 0;
const flush = () => { clearTimeout(saveTimer); saveTimer = 0; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); };

/* ---------- days ---------- */
let today = dayKey();
const blank = () => ({ phase: 'morning', intention: '', journal: '', notes: '', tasks: [], checkins: [], good: '', bedtime: '', nightJournal: '' });
const getDay = k => db.days[k] || (db.days[k] = blank());
const day = () => getDay(today);
const PHASES = ['morning', 'day', 'night'];
const reach = d => ({ morning: 0, day: 1, night: 2, done: 2 }[d.phase]);
const hasContent = d => !!(d.journal.trim() || d.intention.trim() || d.notes.trim() || d.tasks.length || d.checkins.length || d.good.trim() || d.bedtime.trim() || d.nightJournal.trim());
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const MORNING_PROMPTS = [
  "What's on your mind as the day begins?", 'How did you wake up: body, heart, head?', 'What would make today feel well spent?',
  'What are you looking forward to, even a little?', 'What do you want to let go of before the day starts?',
  'Who or what do you want to show up for today?', "Write whatever's loudest in your head."];
const NIGHT_PROMPTS = [
  'What do you want to remember about today?', 'What took your energy, and what gave it back?', 'What are you proud of, even if it was small?',
  'What surprised you today?', 'What would you tell tomorrow-you?', 'What are you grateful for tonight?', 'What did today teach you?'];
const promptFor = (list, k) => list[hash(k) % list.length];
const streak = () => {
  let n = 0; const d = dateOf(today);
  if (!(db.days[dayKey(d)] && hasContent(db.days[dayKey(d)]))) d.setDate(d.getDate() - 1);
  for (;;) { const e = db.days[dayKey(d)]; if (!e || !hasContent(e)) break; n++; d.setDate(d.getDate() - 1); }
  return n;
};
const greetName = () => db.settings.name ? `, ${esc(db.settings.name)}` : '';

/* ---------- the birds ---------- */
const branch = (leafSolid) => `
<path class="ln" stroke-width="6" d="M-4 174 C50 164 112 178 168 170 S238 162 264 168"/>
<path class="${leafSolid ? 'bk' : 'ol'}" d="M206 166 C214 146 236 142 250 148 C244 164 228 170 206 166Z"/>
<path class="${leafSolid ? 'lw' : 'ln'}" stroke-width="1.6" d="M206 166 C220 158 232 154 246 150"/>
<path class="${leafSolid ? 'bk' : 'ol'}" d="M30 172 C28 154 12 148 0 152 C6 166 18 174 30 172Z"/>
<path class="${leafSolid ? 'bk' : 'ol'}" d="M62 170 C70 156 84 154 94 158 C88 168 76 172 62 170Z"/>`;

const bluebird = () => `<svg viewBox="0 0 260 200" role="img" aria-label="A bluebird on a branch">
${branch(false)}
<g class="bob">
 <path class="bk" d="M168 128 L228 156 L216 168 L158 150Z"/>
 <ellipse class="ol" cx="128" cy="116" rx="52" ry="44"/>
 <path class="ln" stroke-width="2" d="M92 132 q4 4 8 0 M106 144 q4 4 8 0 M120 134 q4 4 8 0 M104 124 q4 4 8 0 M132 146 q4 4 8 0"/>
 <path class="bk" d="M126 96 C158 94 176 116 168 144 C148 148 122 134 112 112 C112 104 118 98 126 96Z"/>
 <path class="lw" stroke-width="2" d="M130 108 C146 110 158 122 160 136 M124 118 C138 122 148 130 150 140"/>
 <path class="ln" d="M112 158 v12 M130 160 v10"/>
 <g class="head" style="transform-origin:110px 100px">
  <circle class="ol" cx="96" cy="80" r="30"/>
  <path class="bk" d="M68 76 L48 84 L68 91Z"/>
  <g class="eye" style="transform-origin:86px 74px"><circle class="bk" cx="86" cy="74" r="4.8"/><circle class="wh" cx="87.5" cy="72.4" r="1.6"/></g>
 </g>
</g></svg>`;

const cardinal = () => `<svg viewBox="0 0 260 200" role="img" aria-label="A cardinal on a branch">
${branch(true)}
<g class="bob">
 <path class="bk" d="M166 126 L238 158 L226 172 L156 152Z"/>
 <ellipse class="bk" cx="128" cy="116" rx="52" ry="44"/>
 <path class="lw" stroke-width="2" d="M92 130 q4 4 8 0 M104 142 q4 4 8 0 M118 134 q4 4 8 0 M102 120 q4 4 8 0"/>
 <path class="lw" d="M126 96 C158 94 176 116 168 146 C148 150 122 134 112 112 C112 104 118 98 126 96Z"/>
 <path class="lw" stroke-width="2" d="M130 108 C146 110 158 122 160 138 M124 118 C138 122 148 130 150 142"/>
 <path class="ln" d="M112 158 v12 M130 160 v10"/>
 <g class="head" style="transform-origin:110px 100px">
  <circle class="bk" cx="96" cy="80" r="30"/>
  <path class="bk" d="M78 58 C84 38 100 24 118 12 C112 30 116 48 126 68Z"/>
  <path class="lw" stroke-width="2" d="M70 72 C70 62 82 60 92 66 C94 80 88 94 74 94 C66 90 66 80 70 72Z"/>
  <path class="ol" stroke-width="2.2" d="M66 74 L44 84 L66 95Z"/>
  <g class="eye" style="transform-origin:84px 76px"><circle class="wh" cx="84" cy="76" r="4.6"/><circle class="bk" cx="84.6" cy="76.4" r="2"/></g>
 </g>
</g></svg>`;

const owl = asleep => `<svg class="owl${asleep ? ' asleep' : ''}" viewBox="0 0 260 200" role="img" aria-label="An owl on a branch">
${branch(false)}
<g class="owl-all">
 <path class="bk" d="M96 60 L97 28 L122 50Z"/><path class="bk" d="M164 60 L163 28 L138 50Z"/>
 <ellipse class="ol" cx="130" cy="110" rx="48" ry="56"/>
 <path class="bk" d="M84 92 C66 116 70 152 94 166 C102 142 102 114 96 92Z"/>
 <path class="bk" d="M176 92 C194 116 190 152 166 166 C158 142 158 114 164 92Z"/>
 <path class="ln" stroke-width="2.2" d="M116 116 q7 6 14 0 q7 6 14 0 M114 130 q8 6 16 0 q8 6 16 0 M116 144 q7 6 14 0 q7 6 14 0 M122 156 q4 4 8 0 q4 4 8 0"/>
 <circle class="ol" cx="110" cy="86" r="24"/><circle class="ol" cx="150" cy="86" r="24"/>
 <path class="ln" stroke-width="4" d="M90 68 Q108 58 126 72 M170 68 Q152 58 134 72"/>
 <g class="open">
  <g class="eye" style="transform-origin:110px 86px"><circle class="bk" cx="110" cy="86" r="13"/><circle class="wh" cx="110" cy="86" r="7"/><circle class="bk" cx="110" cy="86" r="4"/></g>
  <g class="eye" style="transform-origin:150px 86px"><circle class="bk" cx="150" cy="86" r="13"/><circle class="wh" cx="150" cy="86" r="7"/><circle class="bk" cx="150" cy="86" r="4"/></g>
 </g>
 <g class="shut"><path class="ln" stroke-width="3.2" d="M95 88 Q110 100 125 88 M135 88 Q150 100 165 88"/></g>
 <path class="bk" d="M130 90 L123 102 L130 111 L137 102Z"/>
 <path class="ln" d="M112 164 v6 M118 164 v6 M142 164 v6 M148 164 v6"/>
</g>
<text class="z" x="186" y="64" font-size="22">z</text><text class="z z2" x="200" y="46" font-size="16">z</text>
</svg>`;

const BIRDS = {
  morning: { name: 'Bluebird', svg: () => bluebird(), lines: ['Good morning! What shall we write today?', 'A fresh page and a fresh sky.', 'Tell me what the day could be.', 'Small plans count. Add one.', 'Breathe in. Then write.'] },
  day: { name: 'Cardinal', svg: () => cardinal(), lines: ["Out in the day, one thing at a time.", 'Look at you, ticking things off!', 'A quick check-in is allowed. Even encouraged.', 'Water? Just asking.', "Whatever happens, you can write it down later."] },
  night: { name: 'Owl', svg: () => owl(false), lines: ["Hoo's ready to wind down?", 'The day is done. Let it settle.', 'You did enough today.', "Set it all down. I'll keep watch.", 'Rest is part of the plan.'] },
  asleep: { name: 'Owl', svg: () => owl(true), lines: ['Zzz…', 'Sleep well.', 'Zzz… tomorrow…'] },
};
let lineIx = 0;

/* ---------- bird voices (tap a bird) ---------- */
let ac;
function voice(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime + 0.02;
    const n = (f0, f1, at, dur, vol = 0.08) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t + at); o.frequency.exponentialRampToValueAtTime(f1, t + at + dur);
      g.gain.setValueAtTime(0.0001, t + at);
      g.gain.exponentialRampToValueAtTime(vol, t + at + dur * 0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      o.connect(g); g.connect(ac.destination); o.start(t + at); o.stop(t + at + dur + 0.02);
    };
    if (kind === 'morning') { [0, 0.16, 0.32].forEach((a, i) => n(2400 + i * 250, 3300 + i * 250, a, 0.12)); n(3000, 2500, 0.56, 0.24, 0.06); }
    else if (kind === 'day') { [0, 0.22, 0.44, 0.66].forEach(a => n(2700, 1500, a, 0.18)); n(1800, 2600, 0.95, 0.16, 0.06); }
    else if (kind === 'night') { n(380, 300, 0, 0.45, 0.12); n(380, 290, 0.62, 0.5, 0.12); }

  } catch {}
}

function dots(d) {

const SCREENS = { welcome: welcomeScreen, morning: morningScreen, day: dayScreen, night: nightScreen, asleep: asleepScreen, history: historyScreen, entry: entryScreen, settings: settingsScreen };

/* ---------- render ---------- */
let lastDark = null;
function render() {
  const d = day();
  const sky = ['history', 'entry', 'settings', 'asleep'].includes(view) ? 'night' : view === 'welcome' ? 'morning' : view;
  const dark = sky === 'night';
  if (dark !== lastDark && lastDark !== null && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.animate({ opacity: [0, 1] }, { duration: 700, easing: 'ease-out' });
  lastDark = dark;
  document.body.dataset.sky = sky;
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', sky === 'night' ? '#000000' : '#ffffff');
  const nav = $('#nav');
  const showNav = ['morning', 'day', 'night', 'asleep'].includes(view);
  nav.hidden = !showNav;
  if (showNav) {
    const r = reach(d), cur = view === 'asleep' ? 'night' : view;
    nav.innerHTML = [['morning', 'Morning', '#6fa8f0'], ['day', 'Day', '#ee5a4b'], ['night', 'Night', '#b7a2e6']].map(([id, label, c], i) =>
      `<button class="phase" style="--c:${c}" data-go="${id === 'night' && d.phase === 'done' ? 'asleep' : id}" ${i > r ? 'disabled' : ''} ${id === cur ? 'aria-current="page"' : ''}><i></i>${label}</button>`).join('');
  }
  $('#b-hist').textContent = view === 'history' || view === 'entry' ? 'Today' : 'Journal';
  $('#b-hist').dataset.go = view === 'history' || view === 'entry' ? 'home' : 'history';
  $('#stage').innerHTML = SCREENS[view]();
  $('.app').scrollTop = 0;
  lineIx = 0;
}

function home() { const d = day(); return !db.settings.welcomed ? 'welcome' : d.phase === 'done' ? 'asleep' : d.phase; }
function go(v) {
  if (v === 'home') v = home();
  if (v === 'night' && day().phase === 'done' && view === 'asleep') v = 'night';
  view = v; render();
}
function advance(to) {
  const d = day();
  const order = ['morning', 'day', 'night', 'done'];
  if (order.indexOf(to) <= order.indexOf(d.phase)) return go(to === 'done' ? 'asleep' : to);
  d.phase = to;
  if (to === 'done') d.finishedAt = Date.now();
  flush();
  view = to === 'done' ? 'asleep' : to;
  render();
}

/* ---------- events ---------- */
const stage = $('#stage');
document.addEventListener('click', e => {
  const bird = e.target.closest('[data-bird]');
  if (bird) return tapBird(bird);
  const mo = e.target.closest('[data-mood]');
  if (mo) { mood = mood === mo.dataset.mood ? '' : mo.dataset.mood; stage.querySelectorAll('[data-mood]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mood === mood)); return; }
  const adv = e.target.closest('[data-advance]');
  if (adv) return advance(adv.dataset.advance);
  const g = e.target.closest('[data-go]');
  if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const d = day();
  switch (a.dataset.act) {
    case 'toggle': { const t = d.tasks.find(t => t.id === a.dataset.id); if (t) { t.done = !t.done; flush(); $('#tasks-wrap').innerHTML = tasksHTML(d); } break; }
    case 'deltask': d.tasks = d.tasks.filter(t => t.id !== a.dataset.id); flush(); $('#tasks-wrap').innerHTML = tasksHTML(d); break;
    case 'delci': d.checkins = d.checkins.filter(c => c.id !== a.dataset.id); flush(); $('#feed').innerHTML = feedHTML(d); break;
    case 'open': openDay = a.dataset.day; view = 'entry'; render(); break;
    case 'welcome': { const n = $('#f-name'); db.settings.name = n ? n.value.trim() : ''; db.settings.welcomed = true; flush(); view = home(); render(); break; }
    case 'export': exportData(); break;
    case 'import': $('#f-import').click(); break;
  }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.field;
  if (f) { day()[f] = e.target.value; save(); return; }
  if (e.target.id === 'f-name' && view === 'settings') { db.settings.name = e.target.value.trim(); save(); }
  if (e.target.id === 'q') { query = e.target.value; $('#hist-list').innerHTML = historyListHTML(); }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const input = form.elements.t, text = input.value.trim(), d = day();
  if (form.dataset.form === 'task') {
    if (!text) return;
    d.tasks.push({ id: uid(), t: text, done: false }); flush();
    $('#tasks-wrap').innerHTML = tasksHTML(d); input.value = ''; input.focus();
  } else if (form.dataset.form === 'checkin') {
    if (!text && !mood) return;
    d.checkins.push({ id: uid(), ts: Date.now(), mood, text }); flush();
    mood = ''; input.value = ''; $('#feed').innerHTML = feedHTML(d);
    stage.querySelectorAll('[data-mood]').forEach(b => b.setAttribute('aria-pressed', 'false'));
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-import' && e.target.files[0]) importData(e.target.files[0]);
});

function tapBird(btn) {
  const kind = btn.dataset.bird, b = BIRDS[kind];
  lineIx = (lineIx + 1) % b.lines.length;
  $('#bubble').textContent = b.lines[lineIx];
  btn.classList.remove('hop'); void btn.offsetWidth; btn.classList.add('hop');
  const pop = document.createElement('span');
  pop.className = 'note-pop'; pop.textContent = kind === 'asleep' ? 'z' : '♪';
  pop.style.left = (40 + Math.random() * 50) + '%'; pop.style.top = '14%';
  btn.parentElement.appendChild(pop); setTimeout(() => pop.remove(), 1500);
  voice(kind);
}

function exportData() {
  flush();
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `journalbird-backup-${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $('#settings-msg').textContent = 'Backup downloaded.';
}
function importData(file) {
  const msg = $('#settings-msg');
  file.text().then(txt => {
    const inc = JSON.parse(txt);
    if (!inc || typeof inc.days !== 'object') throw new Error('bad');
    let added = 0;
    for (const k of Object.keys(inc.days)) {
      const cur = db.days[k];
      if (!cur || !hasContent(cur)) { db.days[k] = { ...blank(), ...inc.days[k] }; added++; }
    }
    if (inc.settings && inc.settings.name && !db.settings.name) db.settings.name = inc.settings.name;
    flush();
    msg.textContent = added ? `Restored ${added} day${added > 1 ? 's' : ''}. Days you already have were left alone.` : 'Nothing new to restore: you already have those days.';
  }).catch(() => { msg.textContent = "That file doesn't look like a JournalBird backup."; });
}

/* ---------- midnight rollover ---------- */
function tick() {
  const k = dayKey();
  if (k !== today) {
    flush(); today = k; mood = ''; view = home(); render();
  }
  const c = $('#countdown'); if (c) c.textContent = countdown();
}
setInterval(tick, 15000);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else tick(); });
addEventListener('focus', tick);
addEventListener('pagehide', flush);

/* ---------- go ---------- */
view = home();
render();
})();
</script>
